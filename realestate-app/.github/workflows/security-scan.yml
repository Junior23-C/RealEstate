name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run dependency security check
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: audit-results.sarif
      continue-on-error: true

  code-security-scan:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint security rules
      run: npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-results.json
      continue-on-error: true

    - name: Run semgrep security scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/typescript
        generateSarif: "1"
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true

  docker-security-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t realestate-app:latest .
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'realestate-app:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  security-headers-test:
    name: Security Headers Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Start application
      run: npm start &
      env:
        PORT: 3000
        NODE_ENV: production

    - name: Wait for application to start
      run: sleep 10

    - name: Test security headers
      run: |
        curl -I http://localhost:3000 > headers.txt
        echo "Checking security headers..."
        
        # Check for required security headers
        if ! grep -i "Content-Security-Policy" headers.txt; then
          echo "❌ Missing Content-Security-Policy header"
          exit 1
        fi
        
        if ! grep -i "X-Frame-Options" headers.txt; then
          echo "❌ Missing X-Frame-Options header"
          exit 1
        fi
        
        if ! grep -i "X-Content-Type-Options" headers.txt; then
          echo "❌ Missing X-Content-Type-Options header"
          exit 1
        fi
        
        echo "✅ All security headers present"

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog secrets detection
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
      continue-on-error: true

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run license checker
      run: |
        npx license-checker --summary --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC' || echo "License check completed with warnings"
      continue-on-error: true

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, secrets-scan, license-compliance]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "Security scan completed"
        echo "Dependency scan: ${{ needs.dependency-scan.result }}"
        echo "Code security scan: ${{ needs.code-security-scan.result }}"
        echo "Secrets scan: ${{ needs.secrets-scan.result }}"
        echo "License compliance: ${{ needs.license-compliance.result }}"